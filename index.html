<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>教務手帳 出欠管理</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:system-ui,sans-serif}button:disabled{opacity:.45;cursor:not-allowed}</style></head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">
<header class="bg-indigo-700 text-white p-4 sticky top-0 z-20"><div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
<h1 class="font-bold text-xl">📚 教務手帳 出欠管理</h1><div class="flex flex-wrap items-center gap-2">
<span id="status" class="text-xs bg-yellow-400 text-black rounded px-2 py-1">未ログイン</span><span id="email" class="text-xs"></span>
<button id="login" onclick="login()" class="bg-white text-indigo-800 rounded px-3 py-2 text-sm">Googleでログイン</button><button id="logout" onclick="logout()" class="hidden bg-indigo-900 rounded px-3 py-2 text-sm">ログアウト</button>
<div id="yearBox" class="hidden flex gap-1 items-center bg-indigo-900 rounded p-1"><select id="year" onchange="changeYear(this.value)" class="bg-indigo-950 rounded p-1 text-sm"></select><button onclick="addYear()" class="bg-indigo-600 rounded px-2">＋年度</button><button onclick="deleteYear()" class="bg-red-600 rounded px-2">削除</button></div>
</div></div></header>
<main id="main" class="hidden max-w-7xl w-full mx-auto p-4 flex-1 flex-col gap-4">
<div id="readonly" class="hidden bg-amber-100 border border-amber-300 rounded p-3 text-sm">過去年度は閲覧専用です。CSV出力のみ利用できます。</div>
<section class="bg-white border rounded-xl p-4 flex flex-wrap justify-between gap-4"><div class="flex flex-wrap items-end gap-3">
<label class="text-xs">クラス<select id="class" onchange="changeClass(this.value)" class="block border rounded p-2 text-sm"></select></label>
<button data-edit onclick="openClass()" class="border rounded p-2 text-sm">クラス・科目設定</button><button data-edit onclick="openStudents()" class="border rounded p-2 text-sm">生徒編集・Excel貼付</button></div>
<div class="flex flex-wrap items-end gap-2"><label class="text-xs">対象日付<input id="date" type="date" class="block border rounded p-2"></label><button data-edit onclick="addSelected()" class="bg-indigo-600 text-white rounded p-2 text-sm">選択生徒に日付追加</button><button data-edit onclick="undo()" class="bg-amber-500 text-white rounded p-2 text-sm">↩ 戻る</button><button onclick="csv()" class="bg-emerald-600 text-white rounded p-2 text-sm">CSV出力</button></div></section>
<section class="bg-indigo-50 border border-indigo-100 rounded-xl p-4"><h2 id="className" class="font-bold text-lg">—</h2><p class="text-sm">科目: <span id="subject">—</span> / 単位数: <span id="units">—</span> / 欠課上限目安: <span id="limit">—</span>回</p></section>
<section class="bg-white border rounded-xl overflow-x-auto"><table class="w-full text-sm"><thead class="bg-gray-100"><tr><th class="p-3"><input type="checkbox" id="all" onchange="selectAll(this)"></th><th class="p-3">番号</th><th class="p-3 text-left">氏名</th><th class="p-3">欠課回数</th><th class="p-3 text-left">欠課日（クリックで削除）</th><th class="p-3">操作</th></tr></thead><tbody id="rows"></tbody></table></section>
</main>
<div id="loginMessage" class="m-auto p-8 text-center"><div class="text-4xl">🔐</div><h2 class="font-bold text-xl my-2">Googleアカウントでログインしてください</h2><p class="text-sm text-gray-600">@g.kagawa-edu.jp の確認済みアカウントを使用してください。</p></div>
<footer class="text-center text-xs text-gray-500 bg-white border-t p-3">教務手帳 出欠管理Webアプリ</footer>

<div id="classModal" class="hidden fixed inset-0 bg-black/50 z-30 items-center justify-center p-4"><div class="bg-white rounded-xl p-5 w-full max-w-lg"><h3 class="font-bold mb-3">クラス・科目設定</h3><label class="block text-sm mb-2">クラス名<input id="cname" class="border rounded p-2 w-full"></label><label class="block text-sm mb-2">科目名<input id="csubject" class="border rounded p-2 w-full"></label><label class="block text-sm mb-3">単位数<input id="cunits" type="number" min="1" max="10" class="border rounded p-2 w-full"></label><div class="flex justify-between"><button onclick="newClass()" class="border rounded p-2 text-sm">＋クラス追加</button><button onclick="removeClass()" class="border border-red-300 text-red-600 rounded p-2 text-sm">クラス削除</button></div><div class="flex justify-end gap-2 mt-4"><button onclick="hide('classModal')" class="bg-gray-100 rounded p-2">キャンセル</button><button onclick="saveClass()" class="bg-indigo-600 text-white rounded p-2">保存</button></div></div></div>
<div id="studentModal" class="hidden fixed inset-0 bg-black/50 z-30 items-center justify-center p-4"><div class="bg-white rounded-xl p-5 w-full max-w-2xl max-h-[90vh] flex flex-col"><h3 class="font-bold mb-2">生徒編集</h3><p class="text-xs text-gray-500 mb-2">Excelから出席番号と氏名の2列をコピーして貼り付けます。</p><textarea id="paste" rows="4" class="border rounded p-2 text-sm" placeholder="1&#9;青木 一郎&#10;2&#9;井上 花子"></textarea><button onclick="parsePaste()" class="self-start border rounded p-2 my-2 text-sm">貼付データを反映</button><div id="studentRows" class="overflow-y-auto flex-1 space-y-2"></div><button onclick="addStudent()" class="self-start border rounded p-2 my-2 text-sm">＋生徒追加</button><div class="flex justify-end gap-2"><button onclick="hide('studentModal')" class="bg-gray-100 rounded p-2">キャンセル</button><button onclick="saveStudents()" class="bg-indigo-600 text-white rounded p-2">保存</button></div></div></div>
<div id="confirmModal" class="hidden fixed inset-0 bg-black/50 z-40 items-center justify-center p-4"><div class="bg-white rounded-xl p-5 w-full max-w-md"><h3 class="font-bold text-red-600 mb-2">削除確認</h3><p id="confirmText" class="text-sm mb-3"></p><input id="confirmInput" class="border rounded p-2 w-full" placeholder="対象名を入力"><div class="flex justify-end gap-2 mt-4"><button onclick="hide('confirmModal')" class="bg-gray-100 rounded p-2">キャンセル</button><button onclick="confirmDelete()" class="bg-red-600 text-white rounded p-2">削除する</button></div></div></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import{getFirestore,doc,getDoc,setDoc,onSnapshot}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

/* Firebase Consoleのプロジェクト設定に表示される値を入力 */
const config={apiKey:"AIzaSyD-KJ1Yx5Pim-HIq5Vt0xvAuQbltZfBTKg",authDomain:"kyoumu-attendance.firebaseapp.com",projectId:"kyoumu-attendance",storageBucket:"kyoumu-attendance.firebasestorage.app",messagingSenderId:"35065093867",appId:"1:35065093867:web:4dbb92e25eedeb3da828ae"};
const DOMAIN="g.kagawa-edu.jp",fb=initializeApp(config),db=getFirestore(fb),auth=getAuth(fb),provider=new GoogleAuthProvider();
provider.setCustomParameters({hd:DOMAIN,prompt:"select_account"});
let user=null,data=null,year="",classId="",stop=null,history=[],loaded=false,pendingDelete=null,saveTimer=null,remoteApplying=false;
const $=id=>document.getElementById(id),copy=x=>JSON.parse(JSON.stringify(x));
const today=()=>{let d=new Date();d=new Date(d.getTime()-d.getTimezoneOffset()*60000);return d.toISOString().slice(0,10)};
function status(t){$("status").textContent=t}
function defaultData(){return{schemaVersion:2,years:{"2026年度":{classes:{class_1:{name:"1年1組",subject:"科目名未設定",units:2,students:[]}}}}}}
function normalize(d){if(!d||typeof d!=="object")return defaultData();if(!d.years){let ys={};for(let[k,v]of Object.entries(d))if(v?.classes)ys[k]=v;d={years:ys}}if(!Object.keys(d.years||{}).length)return defaultData();for(let yd of Object.values(d.years)){yd.classes??={};for(let[id,c]of Object.entries(yd.classes)){c.name??=id;c.subject??="科目名未設定";c.units=Number(c.units)||2;c.students=(c.students||[]).map((s,i)=>({id:Number(s.id)||i+1,number:Number(s.number??s.no)||i+1,name:String(s.name||""),absences:s.absences||s.dates||[]}))}}return d}
function yrNum(s){return Number((String(s).match(/\d{4}/)||[])[0])||0}
function latest(){return Object.keys(data.years).sort((a,b)=>yrNum(b)-yrNum(a)||b.localeCompare(a,"ja"))[0]}
function yd(){return data?.years?.[year]}
function cls(){return yd()?.classes?.[classId]}
function readonly(){return !!data&&year!==latest()}
function editable(){if(readonly()){alert("過去年度は閲覧専用です。現年度を選択してください。");return false}return true}
function ref(){return doc(db,"users",user.uid,"attendance","main")}
function localSave(){localStorage.setItem("attendance_cache_"+user.uid,JSON.stringify(data))}
function queueSave(){if(!loaded||remoteApplying||!editable())return;localSave();status("保存待機中");clearTimeout(saveTimer);saveTimer=setTimeout(save,500)}
async function save(){if(!loaded||remoteApplying)return;try{await setDoc(ref(),{appData:data,updatedAt:new Date().toISOString()});status("同期完了")}catch(e){console.error(e);status("保存失敗");alert("クラウド保存に失敗しました。Firebaseの設定とセキュリティルールを確認してください。")}}
function hist(){history.push(copy(data));if(history.length>20)history.shift()}
function render(){let ys=$("year");ys.innerHTML="";Object.keys(data.years).sort((a,b)=>yrNum(b)-yrNum(a)).forEach(y=>{let o=new Option(y,y);o.selected=y===year;ys.add(o)});let cs=$("class");cs.innerHTML="";let ids=Object.keys(yd()?.classes||{});if(!ids.length){classId="";}else{if(!yd().classes[classId])classId=ids[0];ids.forEach(id=>{let c=yd().classes[id],o=new Option(`${c.name}（${c.subject}）`,id);o.selected=id===classId;cs.add(o)})}
let c=cls();$("className").textContent=c?.name||"クラス未登録";$("subject").textContent=c?.subject||"—";$("units").textContent=c?.units??"—";$("limit").textContent=c?c.units*5:"—";$("rows").innerHTML="";
if(c){[...c.students].sort((a,b)=>a.number-b.number).forEach(s=>{let tr=document.createElement("tr");tr.className="border-t hover:bg-gray-50";let td=document.createElement("td");td.className="p-3 text-center";let cb=document.createElement("input");cb.type="checkbox";cb.className="student-check";cb.dataset.id=s.id;cb.disabled=readonly();td.append(cb);tr.append(td);
for(let val of [s.number]){let x=document.createElement("td");x.className="p-3 text-center";x.textContent=val;tr.append(x)}
let n=document.createElement("td");n.className="p-3 font-semibold";n.textContent=s.name;tr.append(n);
let count=document.createElement("td");count.className="p-3 text-center font-bold";count.textContent=s.absences.length;tr.append(count);
let dates=document.createElement("td");dates.className="p-3";s.absences.forEach((d,i)=>{let b=document.createElement("button");b.className="bg-gray-100 border rounded px-2 py-1 m-0.5 text-xs";b.textContent=d+" ×";b.disabled=readonly();b.onclick=()=>removeDate(s.id,i);dates.append(b)});if(!s.absences.length)dates.textContent="欠課なし";tr.append(dates);
let op=document.createElement("td");op.className="p-3 text-center";let b=document.createElement("button");b.textContent="今日を追加";b.className="bg-indigo-50 border text-indigo-700 rounded px-2 py-1 text-xs";b.disabled=readonly();b.onclick=()=>addToday(s.id);op.append(b);tr.append(op);$("rows").append(tr)})}
$("readonly").classList.toggle("hidden",!readonly());document.querySelectorAll("[data-edit]").forEach(b=>b.disabled=readonly());$("date").disabled=readonly();$("all").disabled=readonly();$("all").checked=false}
window.login=async()=>{try{await signInWithPopup(auth,provider)}catch(e){if(["auth/popup-blocked","auth/operation-not-supported-in-this-environment"].includes(e.code))await signInWithRedirect(auth,provider);else alert("ログインできませんでした: "+e.message)}};
window.logout=async()=>{if(stop)stop();await signOut(auth);location.reload()};
async function session(u){if(!u.emailVerified||!u.email?.toLowerCase().endsWith("@"+DOMAIN)){alert("@g.kagawa-edu.jp の確認済みアカウントでログインしてください。");await signOut(auth);return}
user=u;$("email").textContent=u.email;$("login").classList.add("hidden");$("logout").classList.remove("hidden");$("loginMessage").classList.add("hidden");$("main").classList.remove("hidden");$("main").classList.add("flex");$("yearBox").classList.remove("hidden");status("読み込み中");loaded=false;if(stop)stop();
try{let snap=await getDoc(ref());if(snap.exists()&&snap.data().appData)data=normalize(snap.data().appData);else{data=defaultData();loaded=true;await setDoc(ref(),{appData:data,updatedAt:new Date().toISOString()})}year=latest();classId="";loaded=true;history=[];localSave();render();status("同期完了");
stop=onSnapshot(ref(),s=>{if(!s.exists()||!s.data().appData)return;remoteApplying=true;data=normalize(s.data().appData);if(!data.years[year])year=latest();if(!yd()?.classes?.[classId])classId="";render();localSave();remoteApplying=false;status("同期完了")},e=>{console.error(e);status("同期エラー")});
}catch(e){console.error(e);status("読込失敗");alert("データを読み込めません。Firebase設定・認証・セキュリティルールを確認してください。")}}
onAuthStateChanged(auth,u=>{if(u)session(u);else{$("login").classList.remove("hidden");$("logout").classList.add("hidden");$("main").classList.add("hidden");$("loginMessage").classList.remove("hidden");$("email").textContent="";status("未ログイン")}});
getRedirectResult(auth).catch(console.error);
window.changeYear=y=>{if(data.years[y]){year=y;classId="";render()}};
window.changeClass=id=>{classId=id;render()};
window.addYear=()=>{if(!editable())return;let y=prompt("新年度を入力してください:",(yrNum(latest())+1)+"年度");if(!y?.trim())return;y=y.trim();if(data.years[y])return alert("すでに存在する年度です。");let source=yd(),classes={};if(source)Object.entries(source.classes).forEach(([id,c])=>{classes["class_"+crypto.randomUUID()]={name:c.name,subject:c.subject,units:c.units,students:[]}});if(!Object.keys(classes).length)classes["class_"+crypto.randomUUID()]={name:"1年1組",subject:"科目名未設定",units:2,students:[]};hist();data.years[y]={classes};year=y;classId="";render();queueSave();alert("クラス名・科目名・単位数を引き継ぎ、生徒名簿と欠課記録は空にしました。")};
window.deleteYear=()=>{if(Object.keys(data.years).length<2)return alert("最後の年度は削除できません。");let y=year;if(prompt(`年度「${y}」を完全に削除します。確認のため年度名を入力してください。`)!==y)return alert("年度名が一致しません。");if(!confirm(`${y}の全データを削除します。元に戻せません。よろしいですか？`))return;hist();delete data.years[y];year=latest();classId="";render();queueSave()};
window.selectAll=m=>document.querySelectorAll(".student-check").forEach(c=>c.checked=m.checked);
window.addSelected=()=>{if(!editable())return;let d=$("date").value,selected=[...document.querySelectorAll(".student-check:checked")];if(!d)return alert("日付を選択してください。");if(!selected.length)return alert("生徒を選択してください。");hist();selected.forEach(cb=>{let s=cls().students.find(x=>x.id===Number(cb.dataset.id));if(s)s.absences.push(d)});render();queueSave()};
window.addToday=id=>{if(!editable())return;let s=cls().students.find(x=>x.id===id);if(!s)return;hist();s.absences.push(localToday());render();queueSave()};
function localToday(){let d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
window.removeDate=(id,i)=>{if(!editable())return;let s=cls().students.find(x=>x.id===id);if(!s)return;hist();s.absences.splice(i,1);render();queueSave()};
window.undo=()=>{if(!editable())return;if(!history.length)return alert("戻せる操作履歴がありません。");data=history.pop();render();queueSave()};
window.csv=()=>{let c=cls();if(!c)return;let q=x=>'"'+String(x??"").replace(/"/g,'""')+'"';let out="\uFEFF年度,"+q(year)+"\r\nクラス,"+q(c.name)+"\r\n科目,"+q(c.subject)+"\r\n単位数,"+c.units+"\r\n\r\n出席番号,氏名,欠課回数,欠課日\r\n";c.students.forEach(s=>out+=[q(s.number),q(s.name),s.absences.length,q(s.absences.join(" "))].join(",")+"\r\n");let a=document.createElement("a"),u=URL.createObjectURL(new Blob([out],{type:"text/csv;charset=utf-8"}));a.href=u;a.download=`出欠記録_${year}_${c.name}.csv`;a.click();URL.revokeObjectURL(u)};
window.openClass=()=>{if(!editable())return;let c=cls();if(!c)return;$("cname").value=c.name;$("csubject").value=c.subject;$("cunits").value=c.units;show("classModal")};
window.saveClass=()=>{if(!editable())return;let c=cls(),n=$("cname").value.trim(),s=$("csubject").value.trim(),u=Number($("cunits").value);if(!n||!s||!Number.isInteger(u)||u<1||u>10)return alert("クラス名・科目名・単位数を正しく入力してください。");hist();c.name=n;c.subject=s;c.units=u;hide("classModal");render();queueSave()};
window.newClass=()=>{if(!editable())return;let n=prompt("新しいクラス名:");if(!n?.trim())return;if(Object.values(yd().classes).some(c=>c.name===n.trim()))return alert("同じクラス名があります。");hist();classId="class_"+crypto.randomUUID();yd().classes[classId]={name:n.trim(),subject:"科目名未設定",units:2,students:[]};hide("classModal");render();queueSave()};
window.removeClass=()=>{if(!editable())return;if(Object.keys(yd().classes).length<=1)return alert("最後のクラスは削除できません。");pendingDelete={type:"class",id:classId,name:cls().name};$("confirmText").textContent="クラスの生徒名簿と欠課記録も削除されます。";$("confirmInput").value="";show("confirmModal")};
window.confirmDelete=()=>{if(!pendingDelete)return;if($("confirmInput").value!==pendingDelete.name)return alert("入力した名前が一致しません。");hist();if(pendingDelete.type==="class"){delete yd().classes[pendingDelete.id];classId=""}hide("confirmModal");hide("classModal");pendingDelete=null;render();queueSave()};
window.openStudents=()=>{if(!editable())return;$("paste").value="";$("studentRows").innerHTML="";cls().students.forEach(s=>studentRow(s.number,s.name));show("studentModal")};
function studentRow(num="",name=""){let row=document.createElement("div");row.className="flex gap-2 student-row";let a=document.createElement("input");a.type="number";a.min="1";a.value=num;a.placeholder="番号";a.className="num border rounded p-2 w-20";let b=document.createElement("input");b.value=name;b.placeholder="氏名";b.className="name border rounded p-2 flex-1";let x=document.createElement("button");x.textContent="×";x.className="text-red-600 px-2";x.onclick=()=>row.remove();row.append(a,b,x);$("studentRows").append(row)}
window.addStudent=()=>studentRow();
window.parsePaste=()=>{let t=$("paste").value.trim();if(!t)return;$("studentRows").innerHTML="";t.split(/\r?\n/).forEach((line,i)=>{let a=line.split("\t");studentRow(a.length>1?(Number(a[0])||i+1):i+1,a.length>1?a.slice(1).join(" ").trim():a[0].trim())})};
window.saveStudents=()=>{if(!editable())return;let used=new Set(),arr=[];for(let[i,r]of [...document.querySelectorAll(".student-row")].entries()){let n=Number(r.querySelector(".num").value)||i+1,name=r.querySelector(".name").value.trim();if(!name)continue;if(used.has(n))return alert(`出席番号${n}が重複しています。`);used.add(n);let old=cls().students.find(s=>s.name===name);arr.push({id:i+1,number:n,name,absences:old?[...old.absences]:[]})}hist();cls().students=arr;hide("studentModal");render();queueSave()};
window.show=id=>{$(id).classList.remove("hidden");$(id).classList.add("flex")};window.hide=id=>{$(id).classList.add("hidden");$(id).classList.remove("flex")};
$("date").value=localToday();
</script></body></html>

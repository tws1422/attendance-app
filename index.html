<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教務手帳 for iPad - 出欠管理アプリ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS for Excel Reading -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .date-cell:hover .delete-btn { display: flex; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-indigo-700 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
            <div class="flex items-center gap-3">
                <i class="fa-solid me-2 fa-book-bookmark text-2xl text-amber-300"></i>
                <h1 class="text-xl font-bold tracking-wide">教務手帳 for iPad 出欠管理アプリ</h1>
            </div>
            
            <div class="flex items-center gap-2 flex-wrap">
                <button onclick="copyShareUrl()" class="bg-indigo-800 hover:bg-indigo-900 text-indigo-100 px-3 py-1.5 rounded-lg text-sm font-medium transition flex items-center gap-1.5 border border-indigo-500">
                    <i class="fa-solid fa-share-nodes text-amber-300"></i> 共有URLコピー
                </button>
                <button onclick="changeRoomIdPrompt()" class="bg-indigo-800 hover:bg-indigo-900 text-indigo-100 px-3 py-1.5 rounded-lg text-sm font-medium transition flex items-center gap-1.5 border border-indigo-500">
                    <i class="fa-solid fa-key text-amber-300"></i> 共有ID設定
                </button>
                <button onclick="openClassModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition flex items-center gap-1.5 border border-indigo-400">
                    <i class="fa-solid fa-gear"></i> クラス・科目設定
                </button>
                <button onclick="openStudentModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition flex items-center gap-1.5 border border-indigo-400">
                    <i class="fa-solid fa-user-pen"></i> 生徒編集（Excel読込）
                </button>
                <button onclick="exportCSV()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition flex items-center gap-1.5">
                    <i class="fa-solid fa-file-csv"></i> CSV保存
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full flex flex-col gap-4">

        <!-- Control Bar -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap justify-between items-center gap-4">
            <!-- Left: Selection -->
            <div class="flex items-center gap-4 flex-wrap">
                <div>
                    <label class="block text-xs text-slate-500 font-semibold mb-1">年度</label>
                    <select id="yearSelect" onchange="changeYear(this.value)" class="bg-indigo-50 border border-indigo-300 text-indigo-900 text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block p-2 font-bold min-w-[110px]">
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-slate-500 font-semibold mb-1">クラス</label>
                    <select id="classSelect" onchange="changeClass(this.value)" class="bg-slate-50 border border-slate-300 text-slate-800 text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block p-2 font-medium min-w-[120px]">
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-slate-500 font-semibold mb-1">科目</label>
                    <div id="subjectDisplay" class="text-sm font-bold text-slate-700 bg-slate-100 p-2 rounded-lg border border-slate-200 min-w-[140px]">
                        -
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-slate-500 font-semibold mb-1">単位数</label>
                    <div id="creditDisplay" class="text-sm font-bold text-slate-700 bg-slate-100 p-2 rounded-lg border border-slate-200 min-w-[80px] text-center">
                        -
                    </div>
                </div>
            </div>

            <!-- Right: Date Input Action & Undo Button -->
<!-- ... existing code -->
    <!-- Standard Application Functions -->
    <script>
        window.historyState = [];

        // 年度対応データ構造への移行
        window.appData = {
            currentYear: '2026年度',
            years: {
                '2026年度': {
                    currentClass: '1年1組',
                    classes: {
                        '1年1組': {
                            subject: '英語コミュニケーションⅡ',
                            credit: 2,
                            students: [
                                { id: 1, no: 1, name: '青木 一郎', dates: ['2026/04/10', '2026/04/17'] },
                                { id: 2, no: 2, name: '井上 次郎', dates: ['2026/04/10'] },
                                { id: 3, no: 3, name: '上野 三郎', dates: [] }
                            ]
                        }
                    }
                }
            }
        };

        // 古いデータ構造からの自動相互互換（アップグレード処理）
        function migrateAppData() {
            if (!window.appData.years) {
                const oldClasses = window.appData.classes || {
                    '1年1組': { subject: '未設定', credit: 2, students: [] }
                };
                const oldCurrentClass = window.appData.currentClass || Object.keys(oldClasses)[0] || '1年1組';
                
                window.appData = {
                    currentYear: '2026年度',
                    years: {
                        '2026年度': {
                            currentClass: oldCurrentClass,
                            classes: oldClasses
                        }
                    }
                };
            }
        }

        function getCurrentYearData() {
            migrateAppData();
            if (!window.appData.years[window.appData.currentYear]) {
                const availableYears = Object.keys(window.appData.years);
                window.appData.currentYear = availableYears[0] || '2026年度';
            }
            return window.appData.years[window.appData.currentYear];
        }

        function pushStateHistory() {
            window.historyState.push(JSON.stringify(window.appData));
            if (window.historyState.length > 20) {
                window.historyState.shift();
            }
            updateUndoBtnState();
        }

        window.undoLastAction = function() {
            if (window.historyState.length > 0) {
                const prevState = window.historyState.pop();
                window.appData = JSON.parse(prevState);
                migrateAppData();
                window.saveData();
                window.renderClassSelect();
                window.renderTable();
                updateUndoBtnState();
            }
        };

        function updateUndoBtnState() {
            const undoBtn = document.getElementById('undoBtn');
            if (undoBtn) {
                undoBtn.disabled = window.historyState.length === 0;
            }
        }

        window.saveData = function() {
            window.saveLocalStorage();
            if (window.syncToCloud) {
                window.syncToCloud();
            }
        };

        window.saveLocalStorage = function() {
            localStorage.setItem('attendance_app_data', JSON.stringify(window.appData));
        };

        window.loadLocalStorage = function() {
            const saved = localStorage.getItem('attendance_app_data');
            if (saved) {
                try {
                    window.appData = JSON.parse(saved);
                    migrateAppData();
                } catch(e) {
                    console.error("Failed to parse local storage data", e);
                }
            }
        };

        function sortDates(dates) {
            return dates.sort((a, b) => {
                const parseDate = (dStr) => {
                    const parts = dStr.split('/');
                    if (parts.length === 3) {
                        return parseInt(parts[0], 10) * 10000 + parseInt(parts[1], 10) * 100 + parseInt(parts[2], 10);
                    }
                    if (parts.length === 2) {
                        return parseInt(parts[0], 10) * 100 + parseInt(parts[1], 10);
                    }
                    return 0;
                };
                return parseDate(a) - parseDate(b);
            });
        }

        function formatDateStr(isoStr) {
            if (!isoStr) return '';
            const parts = isoStr.split('-');
            if (parts.length === 3) {
                return `${parts[0]}/${parseInt(parts[1], 10)}/${parseInt(parts[2], 10)}`;
            }
            return isoStr;
        }

        function displayDateStr(fullDateStr) {
            if (!fullDateStr) return '';
            const parts = fullDateStr.split('/');
            if (parts.length === 3) {
                return `${parts[1]}/${parts[2]}`;
            }
            return fullDateStr;
        }

        window.renderClassSelect = function() {
            migrateAppData();
            const yearData = getCurrentYearData();

            // Render Year Dropdown
            const yearSelect = document.getElementById('yearSelect');
            if (yearSelect) {
                yearSelect.innerHTML = '';
                Object.keys(window.appData.years).sort().reverse().forEach(yr => {
                    const opt = document.createElement('option');
                    opt.value = yr;
                    opt.textContent = yr;
                    if (yr === window.appData.currentYear) opt.selected = true;
                    yearSelect.appendChild(opt);
                });
                
                // Add New Year Option
                const addYrOpt = document.createElement('option');
                addYrOpt.value = '__ADD_NEW_YEAR__';
                addYrOpt.textContent = '＋ 新しい年度を追加';
                yearSelect.appendChild(addYrOpt);
            }

            // Render Class Dropdown
            const select = document.getElementById('classSelect');
            if (!select) return;
            select.innerHTML = '';
            
            Object.keys(yearData.classes).forEach(cls => {
                const opt = document.createElement('option');
                opt.value = cls;
                opt.textContent = cls;
                if (cls === yearData.currentClass) opt.selected = true;
                select.appendChild(opt);
            });

            const current = yearData.classes[yearData.currentClass];
            if (current) {
                document.getElementById('subjectDisplay').textContent = current.subject || '（未設定）';
                document.getElementById('creditDisplay').textContent = `${current.credit || 1}単位`;
            }
        };

        window.changeYear = function(selectedYear) {
            if (selectedYear === '__ADD_NEW_YEAR__') {
                const nextYear = prompt("新しく作成する年度名を入力してください（例: 2027年度）:");
                if (nextYear && nextYear.trim()) {
                    pushStateHistory();
                    const yrName = nextYear.trim();
                    if (!window.appData.years[yrName]) {
                        window.appData.years[yrName] = {
                            currentClass: '1年1組',
                            classes: {
                                '1年1組': { subject: '未設定', credit: 2, students: [] }
                            }
                        };
                    }
                    window.appData.currentYear = yrName;
                    window.saveData();
                    window.renderClassSelect();
                    window.renderTable();
                } else {
                    window.renderClassSelect(); // Re-select current
                }
                return;
            }

            window.appData.currentYear = selectedYear;
            window.saveData();
            window.renderClassSelect();
            window.renderTable();
        };

        window.changeClass = function(className) {
            const yearData = getCurrentYearData();
            yearData.currentClass = className;
            window.saveData();
            window.renderClassSelect();
            window.renderTable();
        };

        window.renderTable = function() {
            const tbody = document.getElementById('studentTableBody');
            if (!tbody) return;
            tbody.innerHTML = '';

            const yearData = getCurrentYearData();
            const currentCls = yearData.classes[yearData.currentClass];
            if (!currentCls) return;

            const credit = currentCls.credit || 1;
            const maxAllowed = credit * 12;

            currentCls.students.forEach((student) => {
                student.dates = sortDates(student.dates);
                const count = student.dates.length;
                const remainingHours = maxAllowed - count;

                let nameColorClass = "text-slate-800 font-medium";
                let countColorClass = "text-slate-700 font-bold";
                let warningBadge = "";

                if (remainingHours <= 5) {
                    nameColorClass = "text-red-600 font-bold";
                    countColorClass = "text-red-600 font-bold";
                    warningBadge = `<span class="ml-1 text-xs" title="残り${remainingHours > 0 ? remainingHours : 0}時間で履修不認定">‼️</span>`;
                } else if (remainingHours <= 10) {
                    countColorClass = "text-amber-500 font-bold";
                    warningBadge = `<span class="ml-1 text-xs" title="残り${remainingHours}時間で履修不認定">❗️</span>`;
                }

                const tr = document.createElement('tr');
                tr.className = "hover:bg-indigo-50/30 transition border-b border-slate-200";

                tr.innerHTML = `
                    <td class="p-3 text-center">
                        <input type="checkbox" class="student-checkbox w-4 h-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500" value="${student.id}">
                    </td>
                    <td class="p-3 text-center text-slate-500 font-mono text-xs">${student.no}</td>
                    <td class="p-3">
                        <span class="${nameColorClass}">${student.name}</span>
                        ${warningBadge}
                    </td>
                    <td class="p-3 text-center bg-slate-50/80 border-x border-slate-200">
                        <span class="text-base ${countColorClass}">${count}</span>
                    </td>
                    <td class="p-3">
                        <div class="flex flex-wrap gap-1.5 items-center">
                            ${student.dates.map((d, idx) => `
                                <span class="date-cell inline-flex items-center gap-1 bg-amber-50 text-amber-900 border border-amber-200 text-xs px-2 py-0.5 rounded-md font-mono" title="${d}">
                                    ${displayDateStr(d)}
                                    <button onclick="removeDate(${student.id}, ${idx})" class="delete-btn text-amber-400 hover:text-red-600 ml-0.5" title="削除">
                                        <i class="fa-solid fa-xmark"></i>
                                    </button>
                                </span>
                            `).join('')}
                            <button onclick="addSingleDatePrompt(${student.id})" class="text-slate-400 hover:text-indigo-600 text-xs px-1.5 py-0.5 rounded border border-dashed border-slate-300 hover:border-indigo-300 transition" title="日付を手入力追加">
                                <i class="fa-solid fa-plus text-[10px]"></i> 手入力
                            </button>
                        </div>
                    </td>
                    <td class="p-3 text-center">
                        <button onclick="quickAddCurrentDate(${student.id})" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 px-2.5 py-1 rounded text-xs font-medium transition">
                            今日を追加
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            const selectAllCb = document.getElementById('selectAll');
            if (selectAllCb) selectAllCb.checked = false;
        };

        window.toggleSelectAll = function(master) {
            const checkboxes = document.querySelectorAll('.student-checkbox');
            checkboxes.forEach(cb => cb.checked = master.checked);
        };

        window.addDateToSelected = function() {
            const rawDate = document.getElementById('targetDate').value;
            if (!rawDate) {
                alert('日付を選択してください');
                return;
            }

            const formattedDate = formatDateStr(rawDate);
            const selectedCheckboxes = document.querySelectorAll('.student-checkbox:checked');

            if (selectedCheckboxes.length === 0) {
                alert('対象の生徒にチェックを入れてください');
                return;
            }

            pushStateHistory();

            const yearData = getCurrentYearData();
            const currentCls = yearData.classes[yearData.currentClass];
            selectedCheckboxes.forEach(cb => {
                const studentId = parseInt(cb.value, 10);
                const student = currentCls.students.find(s => s.id === studentId);
                if (student) {
                    student.dates.push(formattedDate);
                }
            });

            window.saveData();
            window.renderTable();
        };

        window.quickAddCurrentDate = function(studentId) {
            pushStateHistory();
            const rawDate = document.getElementById('targetDate').value || new Date().toISOString().split('T')[0];
            const formattedDate = formatDateStr(rawDate);

            const yearData = getCurrentYearData();
            const currentCls = yearData.classes[yearData.currentClass];
            const student = currentCls.students.find(s => s.id === studentId);
            if (student) {
                student.dates.push(formattedDate);
                window.saveData();
                window.renderTable();
            }
        };

        window.addSingleDatePrompt = function(studentId) {
            const defaultDate = displayDateStr(formatDateStr(document.getElementById('targetDate').value));
            const input = prompt("追加する欠課日付を入力してください (例: 11/2 または 2026/11/2)", defaultDate);
            if (input && input.trim()) {
                pushStateHistory();
                let dateToAdd = input.trim();
                if (!dateToAdd.includes('/')) {
                    alert('日付形式は 11/2 または 2026/11/2 のように入力してください');
                    return;
                }
                const parts = dateToAdd.split('/');
                if (parts.length === 2) {
                    const year = new Date().getFullYear();
                    dateToAdd = `${year}/${parseInt(parts[0], 10)}/${parseInt(parts[1], 10)}`;
                }

                const yearData = getCurrentYearData();
                const currentCls = yearData.classes[yearData.currentClass];
                const student = currentCls.students.find(s => s.id === studentId);
                if (student) {
                    student.dates.push(dateToAdd);
                    window.saveData();
                    window.renderTable();
                }
            }
        };

        window.removeDate = function(studentId, dateIndex) {
            pushStateHistory();
            const yearData = getCurrentYearData();
            const currentCls = yearData.classes[yearData.currentClass];
            const student = currentCls.students.find(s => s.id === studentId);
            if (student) {
                student.dates.splice(dateIndex, 1);
                window.saveData();
                window.renderTable();
            }
        };

        window.openClassModal = function() {
            const yearData = getCurrentYearData();
            const current = yearData.classes[yearData.currentClass];
            document.getElementById('modalClassName').value = yearData.currentClass;
            document.getElementById('modalSubjectName').value = current ? current.subject : '';
            document.getElementById('modalCredit').value = current ? current.credit : 2;
            document.getElementById('classModal').classList.remove('hidden');
        };

        window.closeClassModal = function() {
            document.getElementById('classModal').classList.add('hidden');
        };

        window.createNewClassPrompt = function() {
            const name = prompt("新しいクラス名を入力してください（例: 1年2組）:");
            if (name && name.trim()) {
                pushStateHistory();
                const newName = name.trim();
                const yearData = getCurrentYearData();
                if (!yearData.classes[newName]) {
                    yearData.classes[newName] = {
                        subject: '未設定',
                        credit: 2,
                        students: []
                    };
                }
                yearData.currentClass = newName;
                window.saveData();
                window.renderClassSelect();
                window.renderTable();
                window.closeClassModal();
            }
        };

        window.saveClassSettings = function() {
            const className = document.getElementById('modalClassName').value.trim();
            const subjectName = document.getElementById('modalSubjectName').value.trim();
            const creditVal = parseInt(document.getElementById('modalCredit').value, 10);

            if (!className) {
                alert('クラス名を入力してください');
                return;
            }

            pushStateHistory();
            const yearData = getCurrentYearData();
            const oldName = yearData.currentClass;
            if (oldName !== className && yearData.classes[oldName]) {
                const oldData = yearData.classes[oldName];
                delete yearData.classes[oldName];
                yearData.classes[className] = oldData;
            }

            if (!yearData.classes[className]) {
                yearData.classes[className] = {
                    subject: subjectName,
                    credit: creditVal,
                    students: []
                };
            } else {
                yearData.classes[className].subject = subjectName;
                yearData.classes[className].credit = creditVal;
            }

            yearData.currentClass = className;
            window.saveData();
            window.renderClassSelect();
            window.renderTable();
            window.closeClassModal();
        };

        window.deleteCurrentClass = function() {
            const yearData = getCurrentYearData();
            const className = yearData.currentClass;

            if (Object.keys(yearData.classes).length <= 1) {
                alert('【削除できません】\n各年度に最低1つのクラスが必要です。');
                return;
            }

            // 誤削除を防ぐための二重確認メッセージ
            const confirmed = confirm(`【確認】本当にクラス「${className}」を削除してもよろしいですか？\n※このクラスの欠課記録・生徒名簿がすべて消去されます。`);
            
            if (confirmed) {
                // さらに慎重を期す安全入力確認
                const promptCheck = prompt(`誤操作防止のため、削除したいクラス名「${className}」をそのまま入力してください:`);
                if (promptCheck === className) {
                    pushStateHistory();
                    delete yearData.classes[className];
                    yearData.currentClass = Object.keys(yearData.classes)[0];
                    window.saveData();
                    window.renderClassSelect();
                    window.renderTable();
                    window.closeClassModal();
                    alert(`クラス「${className}」を削除しました。`);
                } else if (promptCheck !== null) {
                    alert('クラス名が一致しなかったため、削除をキャンセルしました。');
                }
            }
        };

        window.openStudentModal = function() {
            const yearData = getCurrentYearData();
            document.getElementById('studentModalClassName').textContent = yearData.currentClass;
            const currentCls = yearData.classes[yearData.currentClass];
            
            const textLines = currentCls.students.map(s => `${s.no} ${s.name}`).join('\n');
            document.getElementById('studentListText').value = textLines;
            
            document.getElementById('studentModal').classList.remove('hidden');
        };

        window.closeStudentModal = function() {
            document.getElementById('studentModal').classList.add('hidden');
        };

        window.saveStudentList = function() {
            pushStateHistory();
            const rawText = document.getElementById('studentListText').value;
            const lines = rawText.split('\n').map(l => l.trim()).filter(Boolean);

            const yearData = getCurrentYearData();
            const currentCls = yearData.classes[yearData.currentClass];
            const newStudents = [];

            lines.forEach((line, index) => {
                const parts = line.split(/[\s,\t]+/);
                let no = index + 1;
                let name = line;

                if (parts.length >= 2 && !isNaN(parseInt(parts[0], 10))) {
                    no = parseInt(parts[0], 10);
                    name = parts.slice(1).join(' ');
                }

                const existing = currentCls.students.find(s => s.name === name || s.no === no);
                newStudents.push({
                    id: index + 1,
                    no: no,
                    name: name,
                    dates: existing ? existing.dates : []
                });
            });

            currentCls.students = newStudents;
            window.saveData();
            window.renderTable();
            window.closeStudentModal();
        };

        window.handleFileUpload = function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const data = new Uint8Array(event.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const json = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                    let parsedNames = [];
                    json.forEach(row => {
                        if (!row || row.length === 0) return;
                        row.forEach(cell => {
                            if (cell && typeof cell === 'string' && cell.trim() !== '' && cell !== 'No.' && cell !== 'name' && cell !== '氏名' && cell !== '出席番号') {
                                if (isNaN(cell)) {
                                    parsedNames.push(cell.trim());
                                }
                            }
                        });
                    });

                    parsedNames = [...new Set(parsedNames)];

                    if (parsedNames.length > 0) {
                        const formattedText = parsedNames.map((name, idx) => `${idx + 1} ${name}`).join('\n');
                        document.getElementById('studentListText').value = formattedText;
                        alert(`${parsedNames.length}名の生徒名を読み込みました`);
                    } else {
                        alert('ファイルから生徒名を読み込めませんでした');
                    }
                } catch(err) {
                    alert('ファイルの読み込みに失敗しました');
                    console.error(err);
                }
            };
            reader.readAsArrayBuffer(file);
        };

        window.exportCSV = function() {
            const yearData = getCurrentYearData();
            const currentCls = yearData.classes[yearData.currentClass];
            if (!currentCls) return;

            let csvContent = "\uFEFF";
            csvContent += `年度,${window.appData.currentYear}\n`;
            csvContent += `クラス,${yearData.currentClass}\n`;
            csvContent += `科目,${currentCls.subject}\n`;
            csvContent += `単位数,${currentCls.credit}\n\n`;
            csvContent += `出席番号,生徒氏名,欠課時数,欠課日付\n`;

            currentCls.students.forEach(s => {
                const datesStr = sortDates(s.dates).join(' ');
                csvContent += `"${s.no}","${s.name}","${s.dates.length}","${datesStr}"\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", `出欠記録_${window.appData.currentYear}_${yearData.currentClass}_${currentCls.subject}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };
    </script>
</body>
</html>
